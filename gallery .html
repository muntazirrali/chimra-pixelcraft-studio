<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#111;
    color:white;
}

header{
    text-align:center;
    padding:30px;
    background:black;
}

header h1{
    font-size:40px;
}

.gallery{
    width:90%;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:10px;
    transition:0.4s;
}

.gallery img:hover{
    transform:scale(1.05);
}

footer{
    text-align:center;
    padding:20px;
    background:black;
}
</style>

</head>
<body>

<header>
    <h1>My Photography Gallery</h1>
    <p>Beautiful Nature Collection</p>
</header>

<section class="gallery">

    <img src="https://picsum.photos/id/1015/600/400" alt="Photo">

    <img src="https://picsum.photos/id/1016/600/400" alt="Photo">

    <img src="https://picsum.photos/id/1025/600/400" alt="Photo">

    <img src="https://picsum.photos/id/1035/600/400" alt="Photo">

    <img src="https://picsum.photos/id/1043/600/400" alt="Photo">

    <img src="https://picsum.photos/id/1050/600/400" alt="Photo">

</section>

<footer>
    <p>© 2026 Photography Website</p>
</footer>

</body>
</html>
