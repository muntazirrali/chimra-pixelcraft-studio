<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muntazir Photography</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0d0d0d;
      color:white;
    }

    header{
      text-align:center;
      padding:40px 20px;
      background:black;
    }

    header h1{
      font-size:45px;
      letter-spacing:3px;
      margin-bottom:10px;
    }

    header p{
      color:#bbb;
    }

    .gallery{
      width:90%;
      margin:40px auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:20px;
    }

    .photo{
      overflow:hidden;
      border-radius:15px;
      position:relative;
    }

    .photo img{
      width:100%;
      height:350px;
      object-fit:cover;
      transition:0.5s;
      cursor:pointer;
    }

    .photo img:hover{
      transform:scale(1.08);
      filter:brightness(80%);
    }

    footer{
      text-align:center;
      padding:20px;
      background:black;
      margin-top:40px;
      color:#aaa;
    }
  </style>
</head>

<body>

<header>
  <h1>Muntazir Photography</h1>
  <p>Capturing Nature, Mountains & Beauty</p>
</header>

<section class="gallery">

  <div class="photo">
    <img src="bridge.png" alt="Bridge">
  </div>

  <div class="photo">
    <img src="flower.png" alt="Flower">
  </div>

  <div class="photo">
    <img src="gilgit.png" alt="Gilgit">
  </div>

  <div class="photo">
    <img src="landscape1.png" alt="Landscape">
  </div>

  <div class="photo">
    <img src="leaf.png" alt="Leaf">
  </div>

  <div class="photo">
    <img src="mountain1.png" alt="Mountain">
  </div>

  <div class="photo">
    <img src="mountain2.png" alt="Mountain">
  </div>

  <div class="photo">
    <img src="mountain3.png" alt="Mountain">
  </div>

  <div class="photo">
    <img src="mountain4.png" alt="Mountain">
  </div>

  <div class="photo">
    <img src="night2.png" alt="Night View">
  </div>

  <div class="photo">
    <img src="nightcity.png" alt="Night City">
  </div>

  <div class="photo">
    <img src="portrait1.png" alt="Portrait">
  </div>

  <div class="photo">
    <img src="rose1.png" alt="Rose">
  </div>

  <div class="photo">
    <img src="rose2.png" alt="Rose">
  </div>

</section>

<footer>
  <p>© 2026 Muntazir Photography | All Rights Reserved</p>
</footer>

</body>
</html>
