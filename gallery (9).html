<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Gallery</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#111;
            color:white;
        }

        header{
            text-align:center;
            padding:30px;
            background:#000;
        }

        header h1{
            font-size:40px;
            letter-spacing:3px;
        }

        .gallery{
            width:90%;
            margin:40px auto;
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
            gap:20px;
        }

        .gallery img{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:10px;
            transition:0.4s;
            cursor:pointer;
        }

        .gallery img:hover{
            transform:scale(1.05);
            box-shadow:0 0 15px rgba(255,255,255,0.5);
        }

        footer{
            text-align:center;
            padding:20px;
            background:#000;
            margin-top:30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Photography Gallery</h1>
        <p>Capture Moments Beautifully</p>
    </header>

    <section class="gallery">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Photo 1">

        <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e" alt="Photo 2">

        <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308" alt="Photo 3">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="Photo 4">

        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" alt="Photo 5">

        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e" alt="Photo 6">
    </section>

    <footer>
        <p>© 2026 Photography Website | Designed by You</p>
    </footer>

</body>
</html>
